<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — scoi</title>
    <style>
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; line-height: 1.55; color: #1a1a1a; background: #fff8e1; }
      main { max-width: 520px; margin: 0 auto; padding: 48px 20px; text-align: center; }
      a.btn { display: inline-block; margin-top: 16px; background: #013c58; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; }
      .muted { color: #555; }
    </style>
  </head>
  <body>
    <main>
      <h1>Reset your password</h1>
      <p>Open scoi to choose a new password for your account.</p>
      <p class="muted">If the app does not open automatically, tap the button below.</p>
      <a class="btn" id="open-app" href="scoi://auth-callback">Open scoi</a>
    </main>
    <script>
      (function () {
        var extra = window.location.hash || window.location.search || '';
        var target = 'scoi://auth-callback' + extra;
        var link = document.getElementById('open-app');
        if (link) link.setAttribute('href', target);
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
